[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wefnexus"
version = "0.1.0"
description = "Water-Energy-Food (WEF) nexus modelling and transboundary water diplomacy toolkit for sustainability analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yousef Khajavigodellou" }]
keywords = ["water", "energy", "food", "nexus", "water diplomacy", "transboundary", "sustainability", "hydro-diplomacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "networkx>=3.0"]
data = ["pandas>=1.5"]
dev = ["pytest>=7", "pandas>=1.5", "matplotlib>=3.6", "networkx>=3.0"]

[project.scripts]
wefnexus = "wefnexus.cli:main"

[tool.setuptools.packages.find]
include = ["wefnexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
